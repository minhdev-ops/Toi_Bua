server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Mỗi route CHỈ được có MỘT predicate Path. Nhiều dòng "- Path=..." trong
      # cùng một route bị Spring AND lại (RouteDefinitionRouteLocator dùng
      # Predicate.and), nên "/v1/auth/**" AND "/v1/me/**" không bao giờ đúng.
      # Nhiều pattern trong MỘT predicate thì được OR — đúng ý đồ định tuyến.
      routes:
        - id: identity
          uri: ${services.identity-url}
          predicates:
            - Path=/v1/auth/**,/v1/me/**,/v1/config,/.well-known/jwks.json
        - id: roulette
          uri: ${services.roulette-url}
          predicates:
            - Path=/v1/dishes/**,/v1/spins/**,/v1/exclusions
        - id: place
          uri: ${services.place-url}
          predicates:
            - Path=/v1/places/**,/v1/geocode,/v1/user-locations/**,/v1/matches
        - id: ranking
          uri: ${services.ranking-url}
          predicates:
            - Path=/v1/rank/**
        - id: journal
          uri: ${services.journal-url}
          predicates:
            - Path=/v1/journal/**
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 60
            redis-rate-limiter.burstCapacity: 100
            redis-rate-limiter.requestedTokens: 1
  data:
    redis:
      cluster:
        nodes: ${REDIS_NODES:redis1:7000,redis2:7000,redis3:7000,redis4:7000,redis5:7000,redis6:7000}

services:
  identity-url: ${IDENTITY_URL:http://identity:8081}
  roulette-url: ${ROULETTE_URL:http://roulette:8082}
  place-url: ${PLACE_URL:http://place:8083}
  ranking-url: ${RANKING_URL:http://ranking:8084}
  journal-url: ${JOURNAL_URL:http://journal:8085}

app:
  cursor-secret: ${CURSOR_SECRET:change-me-cursor-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
