server:
  port: 8085
spring:
  application:
    name: journal
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://postgres:5432/angi
    username: angi
    password: angi
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      cluster:
        nodes: redis1:7000,redis2:7000,redis3:7000,redis4:7000,redis5:7000,redis6:7000
app:
  cursor-secret: change-me-cursor-secret
place:
  url: http://place:8083
management:
  endpoints:
    web:
      exposure:
        include: health,info
