name: angi_day
description: "ĂnGìĐây — app Flutter P1 theo docs/01 §3.3 và .ulpi/design/."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: any
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fixtures/
    - assets/bundle/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500
